<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layouts/_header.css">
    <link rel="stylesheet" href="../styles/layouts/movie-details.css">
    <link rel="stylesheet" href="../styles/components/_buttonExample.css">
    <link rel="stylesheet" href="../styles/layouts/footer.css">
    <link rel="stylesheet" href="../styles/layouts/review.css">
    <link rel="stylesheet" href="../styles/layouts/content.css">
    <link rel="stylesheet" href="../styles/layouts/responsive.css">
    <link rel="shortcut icon" href="../images/logo-separada.png" type="image/png">
    <title>Detalhes do filme</title>
</head>
<body>
    <header>
        <a href="../index.html" class="logo btn">
            <img src="../images/logo-separada.png" alt="uniMDB">
        </a>
        <div class="headerSemLogin" id="headerSemLogin">
            <a href="../pages/login.html" class="nav-link">Login</a>
            <a href="../pages/register.html" class="nav-link">Registro</a>
        </div>
        <div class="headerComLogin" id="headerComLogin">
            <a href="../pages/review.html" class="nav-link">Avaliados</a>
            <a href="../pages/favorites.html" class="nav-link">Favoritos</a>
            <a href="../pages/user-profile.html" class="nav-link">Perfil</a>
        </div>
    </header>


    <main id="detalhes-filme">
        <div class="content">
            <img id="poster" alt="Poster do filme">
            <div class="info-filme">
                <h1 id="titulo"></h1>
                <h1>Ano de estreia:</h1>
                <h2><span id="ano"></span></h2>

                <h1>Nota global:</h1>
                <h2><span id="nota"></span></h2>

                <h1>Sinopse:</h1>
                <h2 id="sinopse"></h2>
                <div class ="acaoBotao">
                    <button id="btnAvaliar">Avaliar</button>
                    <button onclick="favorite(event)" id="favoriteBtn" data-favorite="0">♡</button>
                </div>
            </div>
        </div>
        <form onsubmit="saveReview(event)">
            <div id="modal" class="modal">
                <div class="container">
                    <div class="modal-content">
                        <img class="fundo">
                        <span id="fechar" class="close"></span>
                        <div class="titulo" id="tituloFilme"></div>
                        <div class="estrelas" id="estrelas"></div>
                        <div class="avaliacao-texto">
                            <textarea placeholder="Escreva sua opinião..." rows="3" id="comment"></textarea>
                            <button class="submit">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div><h4>Avaliações dos usuários</h4>
            <div id="filmeReview" class="filmeReview"></div>
        </div>
        <div><h4>Títulos semelhantes</h4>
            <div id="relateds" class="relateds"></div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 UniMDB. Todos os direitos reservados.</p>
    </footer>
    <script src="../scripts/pages/login.js" defer></script>
    <script src="../scripts/services/validation/userValidation.js" defer></script>
    <script src="../scripts/pages/movie-details.js" defer></script>
</body>
</html>
